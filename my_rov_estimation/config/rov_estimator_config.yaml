%YAML:1.0 # need to specify the file type at the top!

verbosity: "INFO" # ALL, DEBUG, INFO, WARNING, ERROR, SILENT

use_fej: true
integration: "rk4"

# Two NON-overlapping cameras (front + down): track each one as mono.
# NOTE: the launch file also forces these two values, because the node
# parameters override this file.
use_stereo: false
max_cameras: 2

calib_cam_extrinsics: true  # refine the T_cam_imu derived from the scenario
calib_cam_intrinsics: false # simulator intrinsics are exact (ideal pinhole)
calib_cam_timeoffset: true  # sensor stamps are taken at publish time
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 11
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 1

gravity_mag: 9.81

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

try_zupt: false
zupt_chi2_multipler: 0
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity: 0.5
zupt_only_at_beginning: false

# ------------------------------------------------------------------
# Initialization
# ------------------------------------------------------------------
init_window_time: 2.0
# std-dev of the accelerometer needed to detect the "jerk" that ends the static
# window. 1.5 (EuRoC default) is far too high for a slow ROV: lowered.
# If initialization never happens, lower it further (0.2); if it triggers on
# noise, raise it. Simulated accel noise is only 0.05 m/s^2.
init_imu_thresh: 0.15
init_max_disparity: 10.0
init_max_features: 50

init_dyn_use: false
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 10.0

init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-12

init_dyn_bias_g: [ 0.0, 0.0, 0.0 ]
init_dyn_bias_a: [ 0.0, 0.0, 0.0 ]

record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"

save_total_state: false
filepath_est: "/tmp/ov_estimate.txt"
filepath_std: "/tmp/ov_estimate_std.txt"
filepath_gt: "/tmp/ov_groundtruth.txt"

# ------------------------------------------------------------------
# Front-end (per camera)
# ------------------------------------------------------------------
use_klt: true
num_pts: 200              # per camera
fast_threshold: 15        # pool/underwater scenes have low texture
grid_x: 5
grid_y: 5
min_px_dist: 15
knn_ratio: 0.70
track_frequency: 15.0     # = camera rate in rov_3.scn
downsample_cameras: false
num_opencv_threads: 4
histogram_method: "HISTOGRAM" # try CLAHE on real (hazy) footage

use_aruco: false
num_aruco: 0
downsize_aruco: true

up_msckf_sigma_px: 1
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: false

# imu and camera spatial-temporal calibration (same folder as this file)
relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
