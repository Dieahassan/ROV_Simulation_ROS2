ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: false
    publish_tf: true

    # الأسماء الصحيحة المطابقة لملف Stonefish Scenario
    map_frame: map
    odom_frame: odom
    base_link_frame: rov2/base_link
    world_frame: odom

    # --- Sensor 1: IMU ---
    imu0: /rov_2/imu
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  true,  true]
    imu0_differential: false
    imu0_queue_size: 10
    imu0_qos: best_effort

    # --- Sensor 2: Depth Pose ---
    pose0: /rov_2/pose_z
    pose0_config: [false, false, true,   # Z position فقط
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false
    pose0_queue_size: 10
    pose0_qos: best_effort

    