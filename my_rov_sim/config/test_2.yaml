    frequency: 30.0
    two_d_mode: false
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: rov2/pressure
    world_frame: odom

    # --- Sensor 2: Depth Pose ---
    pose0: /rov_2/depth_pose
